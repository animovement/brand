[workspace]
name = "animovement-brand"
description = "Generators for the animovement package hexes, marks, OG card and banner"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[dependencies]
python = ">=3.11"
numpy = "*"
fonttools = "*"
pillow = "*"
cairosvg = "*"          # rasterises SVG for `verify`

[tasks]
packages = { cmd = "python -m animovement_brand.gen_packages base/animovement-fixed.svg out/packages", description = "Package hexes" }
rainbow  = { cmd = "python -m animovement_brand.gen_rainbow  base/animovement-fixed.svg out/packages", description = "animovement metapackage hex" }
marks    = { cmd = "python -m animovement_brand.gen_marks  out/marks",  description = "Icon marks" }
og       = { cmd = "python -m animovement_brand.gen_og     out/og",     description = "OpenGraph card" }
banner   = { cmd = "python -m animovement_brand.gen_banner out/banner", description = "README banner" }
all      = { depends-on = ["packages", "rainbow", "marks", "og", "banner"], description = "Regenerate every asset" }
verify   = { cmd = "python -m animovement_brand.verify", depends-on = ["all"], description = "Diff regenerated artwork against a reference directory" }
